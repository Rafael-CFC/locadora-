<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7F3EC">
<title>Painel · Loca Fácil</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Montserrat:wght@700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="painel.css">
</head>
<body>
<div class="p-app" data-app>

  <!-- Tela de login -->
  <section class="p-login" data-tela="login">
    <form class="p-login__card" data-login novalidate>
      <div class="p-marca"><svg class="p-logo" viewBox="0 0 240 172" role="img" aria-label="Garopaba Loca Fácil Veículos"><text x="120" y="22" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="800" font-size="22.5" letter-spacing="1.2" fill="#0B3A27">GAROPABA</text><path d="M86 62 94 44q2-5 8-5h36q6 0 8 5l8 18 6 1q6 1 6 8v21H74V71q0-7 6-8z" fill="#F2C21B"/><path d="M70 56h11l1 6H71zM170 56h-11l-1 6h11z" fill="#F2C21B"/><path d="M101 45h38l7 15H94z" fill="#0B3A27"/><path d="M78 70l18 3-2 5-14-2zM162 70l-18 3 2 5 14-2z" fill="#fff"/><rect x="106" y="72" width="28" height="4" rx="2" fill="#0B3A27"/><rect x="110" y="80" width="20" height="3" rx="1.5" fill="#0B3A27"/><path d="M51 87h138l11 11v46l-80 25-80-25V98z" fill="#0B3A27"/><text x="120" y="131" text-anchor="middle" font-family="&#39;Baloo 2&#39;, sans-serif" font-weight="700" font-size="33" fill="#F2C21B">loca fácil</text><text x="120" y="152" text-anchor="middle" font-family="&#39;Baloo 2&#39;, sans-serif" font-weight="600" font-size="15" fill="#fff">veículos</text><rect x="62" y="145.5" width="26" height="2.2" rx="1.1" fill="#fff"/><rect x="152" y="145.5" width="26" height="2.2" rx="1.1" fill="#fff"/></svg></div>
      <h1>Painel da locadora</h1>
      <p class="p-muted">Atualize carros, preços, fotos e avisos do site.</p>
      <label class="p-field"><span>E-mail</span><input name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" required></label>
      <label class="p-field"><span>Senha</span>
        <span class="p-senha"><input name="senha" type="password" autocomplete="current-password" required><button type="button" class="p-link" data-ver-senha>Mostrar</button></span>
      </label>
      <p class="p-erro" data-login-erro hidden></p>
      <button class="p-btn p-btn--primario p-btn--grande" type="submit">Entrar</button>
      <p class="p-aviso-config" data-sem-api hidden>O painel ainda não foi conectado ao serviço de publicação. Veja o guia de configuração.</p>
    </form>
  </section>

  <!-- Painel -->
  <section class="p-painel" data-tela="painel" hidden>
    <header class="p-topo">
      <div class="p-topo__linha">
        <div class="p-marca p-marca--pequena"><svg class="p-logo" viewBox="0 0 240 172" role="img" aria-label="Garopaba Loca Fácil Veículos"><text x="120" y="22" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="800" font-size="22.5" letter-spacing="1.2" fill="#0B3A27">GAROPABA</text><path d="M86 62 94 44q2-5 8-5h36q6 0 8 5l8 18 6 1q6 1 6 8v21H74V71q0-7 6-8z" fill="#F2C21B"/><path d="M70 56h11l1 6H71zM170 56h-11l-1 6h11z" fill="#F2C21B"/><path d="M101 45h38l7 15H94z" fill="#0B3A27"/><path d="M78 70l18 3-2 5-14-2zM162 70l-18 3 2 5 14-2z" fill="#fff"/><rect x="106" y="72" width="28" height="4" rx="2" fill="#0B3A27"/><rect x="110" y="80" width="20" height="3" rx="1.5" fill="#0B3A27"/><path d="M51 87h138l11 11v46l-80 25-80-25V98z" fill="#0B3A27"/><text x="120" y="131" text-anchor="middle" font-family="&#39;Baloo 2&#39;, sans-serif" font-weight="700" font-size="33" fill="#F2C21B">loca fácil</text><text x="120" y="152" text-anchor="middle" font-family="&#39;Baloo 2&#39;, sans-serif" font-weight="600" font-size="15" fill="#fff">veículos</text><rect x="62" y="145.5" width="26" height="2.2" rx="1.1" fill="#fff"/><rect x="152" y="145.5" width="26" height="2.2" rx="1.1" fill="#fff"/></svg><span class="p-marca__painel">Painel</span></div>
        <div class="p-topo__acoes">
          <a class="p-btn p-btn--leve" data-ver-site target="_blank" rel="noopener">Ver site</a>
          <button class="p-btn p-btn--leve" type="button" data-sair>Sair</button>
        </div>
      </div>
      <nav class="p-abas" aria-label="Seções do painel">
        <button type="button" class="p-aba" data-aba="carros" aria-current="page">Carros</button>
        <button type="button" class="p-aba" data-aba="avisos">Avisos</button>
        <button type="button" class="p-aba" data-aba="empresa">Empresa</button>
      </nav>
    </header>

    <div class="p-status" data-status hidden></div>

    <main class="p-conteudo">
      <div data-vista="carros"></div>
      <div data-vista="editor" hidden></div>
      <div data-vista="avisos" hidden></div>
      <div data-vista="empresa" hidden></div>
    </main>

    <div class="p-publicar" data-barra-publicar hidden>
      <p><strong>Alterações não publicadas</strong><span data-resumo-alteracoes></span></p>
      <div class="p-publicar__acoes">
        <button type="button" class="p-btn p-btn--leve" data-descartar>Descartar</button>
        <button type="button" class="p-btn p-btn--primario" data-publicar>Publicar no site</button>
      </div>
    </div>
  </section>

  <div class="p-carregando" data-carregando hidden><span></span>Carregando…</div>
</div>
<div class="p-toast" role="status" aria-live="polite" data-toast></div>
<dialog class="p-dialogo" data-dialogo>
  <form method="dialog">
    <p data-dialogo-texto></p>
    <div class="p-dialogo__acoes">
      <button class="p-btn p-btn--leve" value="nao">Cancelar</button>
      <button class="p-btn p-btn--perigo" value="sim" data-dialogo-ok>Confirmar</button>
    </div>
  </form>
</dialog>
<script src="config.js"></script>
<script src="painel.js"></script>
</body>
</html>
